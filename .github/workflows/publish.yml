name: Publish to Docker Hub

# - push to main touching the image files
# - manual run
# - weekly: rebuild on top of fresh official python images (security updates)
on:
  push:
    branches: [main]
    paths: [Dockerfile, README.md, .github/workflows/publish.yml]
  workflow_dispatch:
  schedule:
    - cron: "37 4 * * 1"

permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

env:
  IMAGE: quai1rol/python-freetds
  LATEST: "3.15"

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Tags
        id: tags
        run: |
          t="$IMAGE:${{ matrix.python }}"
          [ "${{ matrix.python }}" = "$LATEST" ] && t="$t,$IMAGE:latest"
          echo "tags=$t" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v7
        with:
          context: .
          pull: true
          platforms: linux/amd64,linux/arm64
          build-args: PYTHON_VERSION=${{ matrix.python }}
          push: true
          tags: ${{ steps.tags.outputs.tags }}

  description:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Needs a Docker Hub token with "Read, Write, Delete" scope.
      - uses: peter-evans/dockerhub-description@v5
        continue-on-error: true
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ env.IMAGE }}
          short-description: "Python with FreeTDS and unixODBC. Source: github.com/Iv/python-freetds"
          readme-filepath: README.md
